# Regenera os SVGs do README (assets/terminal.svg e assets/contrib.svg) com dados reais.
# Roda diariamente, manualmente, ou quando o gerador/fonte mudam. Só faz commit se algo mudou.
name: Build README SVGs

on:
  schedule:
    - cron: "0 4 * * *"          # diariamente, 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/*.py
      - assets/fonts/**

permissions:
  contents: write

concurrency:
  group: build-svgs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: "1"
        run: python scripts/main.py

      - name: Commit se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg scripts/terminal-data.json scripts/contrib-data.json
          if git diff --staged --quiet; then
            echo "SVGs sem mudanças"
          else
            git commit -m "chore: atualiza SVGs do README [skip ci]"
            git push
          fi
